[package]
name = "walgit-tray"
version = "0.1.0"
edition = "2021"
description = "walgit 服务托盘(macOS / Windows / Linux)"

# Windows 二进制的图标资源(build.rs 只在 Windows target 上调它,见
# deploy/windows/walgit.rc)。关掉默认 feature:唯一的默认 feature `toml` 只用来读
# [package.metadata.winresource],而这里用的是自己的 .rc 文件。它只为「找到并调用
# 资源编译器」而存在(MSVC → Windows SDK 的 rc.exe,GNU → windres)。
[build-dependencies]
winresource = { version = "0.1", default-features = false }

[dependencies]
winit = "0.30"

# GitHub `releases/latest` 是第三方 JSON(转义/嵌套/null 都要正确解析),而这
# 条数据决定「要不要下载并安装一个新二进制」——手写 JSON 扫描器在这里是负债。
# 只用 Value 导航,不引 derive。
serde_json = "1"

# Exact SHA-256 verification is part of the update trust boundary. Keep it in
#-process instead of depending on a platform utility's output format.
sha2 = "0.10"

[profile.release]
opt-level = "z"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
# 上游一等公民 SNI 后端(ksni)：不引 libappindicator/gtk/libxdo 系统库，也不再带
# glib（Dependabot medium 告警的来源）。macOS/Windows 不需要该 feature。
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.25", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 点 Dock 图标 → 打开 Web UI(#200)。winit 持有 NSApplication delegate 且不转发
# `applicationShouldHandleReopen:hasVisibleWindows:`，所以这里往**它的 delegate 类**
# 上注入这一个方法(它没实现,故不覆盖其行为)。crate 均已在依赖树里(tray-icon/muda)。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSApplication"] }
objc2-foundation = { version = "0.2", features = ["NSObject"] }


# 单实例命名互斥(仅 Windows 用;版本对齐 tray-icon 传递依赖,不引入新树)。
# Win32_Security 是 CreateMutexW 声明的 cfg 要求——没有它,今天能编译全靠
# winit 传递启用该 feature,winit 一裁剪就断编。
[target.'cfg(windows)'.dependencies]
# Win32_UI_WindowsAndMessaging 是菜单循环自愈守卫的声明要求(GetGUIThreadInfo /
# PostMessageW / GUI_INMENUMODE);只靠 winit 传递启用是隐式依赖,一裁剪就断编。
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }

# 独立 crate:不加入 walgit workspace(根 Cargo.toml),自建 target/lock。
[workspace]
