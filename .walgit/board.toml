# walgit 看板定义（.walgit/board.toml）——walgit 是主仓，看板/issue/PR 都在 refs/collab/*
# 看板是线程集合在声明式列定义下的确定性投影：卡片进入【第一个】满足谓词的列；
# 字段留空 = 匹配任意。未命中任何列的线程不出现在看板上。
# 移动卡片 = 追加一条签名 `status` 条目，不是改这个文件。

version = 1

[sort]
by = "ts"          # ts(默认,按最后活动) | id(按线程 id)
direction = "desc" # desc(默认,新在前) | asc

# owner 从哪来：看板把线程里所有 `status` 条目按 parent 链顺序做**逐字段继承**：
#   status               取最新一条带字符串 `status` 的 status 条目
#                        （`merge_result {"merged":true}` 也可把卡片置成 merged）
#   owner/worktree/branch 各自取最新一条**写了该字段**的 status 条目：
#                        缺字段继承旧值，显式空字符串清除
#   work                 缺省回退到同一条 status 的 note
# 投影**不按验签过滤**（未验签条目的字段同样进看板）；验签只体现在 verified/unverified
# 计数与 `done` 的门禁上（done 需要 needs-review + verified approve）。
# 只写 `issue` 根条目、没有 `status` 的线程 → 默认 open + owner 空（看板显示"未分配"）。
# 因此**建单即认领**：创建 issue 后立刻补一条带 owner 的 status；纯待办也要 owner，
# 用 blocked / needs-human 表达。评论里写 owner 不算数——只有 status 条目的字段进看板。
#
# 示例：
#   walgit --config ~/.walgit/walgit.toml collab entry --kind status \
#     --id <thread-id> --actor <you> --parent <issue-oid> \
#     --body '{"status":"in-progress","owner":"<principal>","worktree":"wt-x","branch":"feat/x","work":"..."}' \
#     --key ~/.walgit/keys/<principal>.ed25519 --push origin

# 一列一个谓词；只声明你真正想看到的列。
# 字段：name(必填)、kind、status、merge、unverified
#   kind       —— 线程必须包含该 kind 的条目
#   status     —— 卡片有效状态(card_status)必须等于它
#   merge      —— "allowed" | "blocked"：patch 的合并规则判定（无 patch 的线程不匹配）
#   unverified —— true 时只收"至少含 1 条未验签条目"的卡片
[[column]]
name = "open"
status = "open"

[[column]]
name = "in-progress"
status = "in-progress"

[[column]]
name = "needs-review"
status = "needs-review"

[[column]]
name = "blocked"
status = "blocked"

[[column]]
name = "needs-human"
status = "needs-human"

# 终态有三种合法的 card_status，都要有列，否则卡片会在合并/结项后消失：
#   merged  —— merge_result {"merged": true} 置位（本仓库新流程用它）
#   done    —— status {"status":"done"}（门禁要求 needs-review + 已验签 approve；web/SKILL.md 与
#              docs/USER_GUIDE.md 教这个值）
#   closed  —— status {"status":"closed"}（结项归档，可在 merged/done 之后追加）
[[column]]
name = "merged"
status = "merged"

[[column]]
name = "done"
status = "done"

[[column]]
name = "closed"
status = "closed"

# 只列"被规则判为不可合并"的 PR 时用 merge 谓词（与上面的 status 列不同）：
# [[column]]
# name = "unmergeable"
# merge = "blocked"
