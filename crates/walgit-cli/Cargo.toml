[package]
name = "walgit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "walgit"

[lib]
name = "walgit_cli"
path = "src/lib.rs"

[[bin]]
name = "walgit"
path = "src/bin/walgit.rs"

[[bin]]
name = "walgit-server"
path = "src/bin/walgit-server.rs"

[dependencies]
walgit-proto.workspace = true
walgit-store.workspace = true
walgit-config.workspace = true
walgit-git.workspace = true
walgit-wal.workspace = true
walgit-server.workspace = true
walgit-bundle = { path = "../walgit-bundle", features = ["wal"] }
gix-hash.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
clap.workspace = true
mimalloc.workspace = true
rand.workspace = true
serde_json.workspace = true
serde.workspace = true
sha1.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
chrono.workspace = true
humantime.workspace = true
tokio-util.workspace = true
futures.workspace = true
bytes.workspace = true
toml.workspace = true
reqwest.workspace = true
# `ring` is the runtime crypto provider installed in lib.rs (one per process).
# Note aws-lc-rs stays in the dependency graph through other crates
# (google-cloud-auth/quinn-proto/jsonwebtoken), so it does NOT disappear from
# windows-msvc builds — the provider choice here is about which provider this
# binary installs, not about what compiles.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
axum.workspace = true
tempfile.workspace = true
# Process-group kill on the §8.1 timeout path (killpg), Unix only.
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
bytesize.workspace = true
serde_json.workspace = true

[lints]
workspace = true
