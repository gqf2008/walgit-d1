name: Release

# Tag v* to publish: builds the linux, windows, and signed/notarized macOS
# installers, generates a changelog from Conventional Commits since the previous
# tag, and attaches everything to a GitHub Release. Versioning is semantic; the
# v0.1 milestone is the first target (AGENTS.md §6.4). workflow_dispatch runs
# the packaging/signing path without publishing a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: DMG version for a signing dry run (release publish is skipped)
        required: false
        default: 0.0.0-ci

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Tag pushes release normally; workflow_dispatch runs the same packaging path
  # as a signing dry run and skips the release job.
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc (and the tray's GTK dev libs on linux)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then choco install protoc -y --no-progress; else sudo apt-get update && sudo apt-get install -y protobuf-compiler libgtk-3-dev libayatana-appindicator3-dev libxdo-dev; fi
        shell: bash
      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup show && cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          # tray-rs is its own workspace (own Cargo.lock) but its build lands in
          # the root target/ (repo .cargo/config.toml target-dir, cwd-based
          # discovery) — key the cache on both locks or the tray deps rebuild cold.
          workspaces: |
            .
            deploy/tray/tray-rs -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the SPA and the SDK (embedded into the binary)
        run: just web-build
        shell: bash
      - name: Build release binary
        # Release binaries report the tag (v0.2.0), not the commit sha
        # (build.rs prefers WALGIT_BUILD_SHA; dev builds keep sha, issue #121).
        env:
          WALGIT_BUILD_SHA: ${{ env.RELEASE_VERSION }}
        run: cargo build --release --bin walgit --bin walgit-server
      # --target-dir pins the tray exe into the root target/ regardless of how
      # cargo resolves the nested workspace's own [workspace]/.cargo config —
      # the same dir the upload globs and installer.iss expect.
      - name: Build the tray app
        run: cargo build --release --target-dir target --manifest-path deploy/tray/tray-rs/Cargo.toml
      # One installer per platform (issue #108): the .deb is the only linux release
      # artefact, the Inno Setup exe the only windows one; raw binaries are not
      # published. The macOS DMG is built by the dedicated `macos` job below.
      - name: Assemble the linux .deb
        if: runner.os == 'Linux'
        shell: bash
        run: deploy/linux/build-deb.sh target/release "$RELEASE_VERSION"
      - name: Build the Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # ISCC is preinstalled on windows runners; provision it if a future
          # image drops it. Version from the tag (v0.1.0 → 0.1.0).
          if ! command -v ISCC.exe && [ ! -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi
          iscc="$(command -v ISCC.exe || echo '/c/Program Files (x86)/Inno Setup 6/ISCC.exe')"
          "$iscc" "-DMyAppVersion=${RELEASE_VERSION#v}" deploy/windows/installer.iss
      - name: Upload the .deb (linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: walgit-linux-deb
          path: walgit_*.deb
      # The installer rides a SEPARATE artifact: upload-artifact roots an artifact
      # at the least-common-ancestor of its paths, so mixing target/release with
      # deploy/windows/Output would re-root at the workspace root and hand
      # `gh release create artifacts/*` directories instead of files.
      - name: Upload the Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: walgit-windows-installer
          path: deploy/windows/Output/walgit-setup-*.exe


  macos:
    name: build (macos)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: brew install protobuf

      - name: Install the stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup show
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            deploy/tray/tray-rs -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Import Developer ID certificate (temporary keychain)
        id: signing
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_CERT_P12:?missing APPLE_CERT_P12 secret}"
          : "${APPLE_CERT_PASSWORD:?missing APPLE_CERT_PASSWORD secret}"
          keychain="$RUNNER_TEMP/walgit-signing.keychain-db"
          cert="$RUNNER_TEMP/walgit-signing.p12"
          keychain_password="walgit-ci-signing"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security default-keychain -s "$keychain"
          printf '%s' "$APPLE_CERT_P12" | base64 --decode > "$cert"
          security import "$cert" -k "$keychain" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          [ -n "$identity" ] || {
            echo "no Developer ID Application identity in temporary keychain" >&2
            exit 1
          }
          rm -f "$cert"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Build, sign, notarize, and staple the DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          CODESIGN_KEYCHAIN: ${{ runner.temp }}/walgit-signing.keychain-db
          CODESIGN_KEYCHAIN_PASSWORD: walgit-ci-signing
          WALGIT_IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARY_S3_ACCELERATION: '0'
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          [ -n "$version" ] || { echo "missing release version" >&2; exit 1; }
          ./deploy/tray/macos/build-dmg.sh "$version"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: walgit-macos-dmg
          path: deploy/tray/macos/dist/walgit-*.dmg
          if-no-files-found: error

      - name: Delete temporary signing keychain
        if: always()
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/walgit-signing.keychain-db" 2>/dev/null || true

  release:
    name: Publish release
    needs: [build, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog
        id: changelog
        run: |
          # The tag being released is excluded: descending version sort can put
          # the current tag (or a pre-release like v0.2.1-rc1, which sorts above
          # its release) on the line `sed -n '2p'` would otherwise pick, making
          # the range empty or start at a pre-release.
          prev=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF#refs/tags/}$" | sed -n '1p')
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
          git log --pretty=format:'%s' "$range" | grep -E '^(feat|fix|docs|refactor|test|perf|chore)(\(|:)' > changelog.txt || true
          echo "generated from ${range:-HEAD}"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          body="$(cat changelog.txt 2>/dev/null || echo '')"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-cut of an existing release (a re-pushed tag rebuilds packaging):
            # attach the fresh artefacts, leave the body untouched. --clobber only
            # replaces same-named assets — a release cut under an older shape (raw
            # binaries) keeps them; the maintainer prunes those by hand.
            gh release upload "$tag" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --notes "$body"
          fi
