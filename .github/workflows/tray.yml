name: tray

# tray-rs 是独立 workspace(不进 walgit workspace 的 just/clippy/test 门禁),
# 但它是发布产物的一部分(release.yml 构建它,Windows 安装器打包它)——
# 本工作流给它自己的类型检查:两个平台各一次 release 构建,PR 即红即拦。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: tray (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable && cargo --version
        shell: bash
      - name: GTK dev libs (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - uses: Swatinem/rust-cache@v2
        with:
          # 与 release.yml 同形:tray-rs 独立 lock,构建产物落根 target/
          # (仓库 .cargo/config.toml 的 target-dir,cwd 发现)。
          workspaces: |
            .
            deploy/tray/tray-rs -> target
      - name: Build (release)
        run: cargo build --release --target-dir target --manifest-path deploy/tray/tray-rs/Cargo.toml
      # 版本比较/release 解析/菜单文本是升级路径的判断依据(#183)——三平台
      # 都跑单测,别只在 macOS 上才验证。
      - name: Unit tests
        run: cargo test --target-dir target --manifest-path deploy/tray/tray-rs/Cargo.toml
      - name: Clippy (deny warnings)
        run: cargo clippy --target-dir target --manifest-path deploy/tray/tray-rs/Cargo.toml --all-targets -- -D warnings
      - name: macOS tray release/package guards
        if: runner.os == 'macOS'
        env:
          WALGIT_TRAY_BIN: ${{ github.workspace }}/target/release/walgit-tray
        run: deploy/tray/macos/test.sh
