name: CI

# The repository had no build/test workflow: only pages.yml (a site deploy). A workspace that did
# not compile reached main because nothing ran cargo on push. This runs `just ci` — the same
# tiers AGENTS.md documents (warnings, clippy, test, e2e) — so CI and a contributor's laptop cannot drift.
# The tier definitions live in the justfile, never duplicated here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Upstream set cancel-in-progress for the PR-update flow; in this fork's
  # maintenance mode runs are dispatched manually per commit, and cancelling
  # the in-flight run repeatedly killed the ~40 min windows leg before it
  # could report (its result is the scarce signal here). Runs may pile up on
  # this branch; dispatch deliberately.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: warnings + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # prost-build does not vendor protoc; without it the proto crate fails with NotFound.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # No toolchain pin: build with stable (rust-toolchain.toml was removed). Install it
      # explicitly so the runner does not silently drift with its image default.
      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup show && cargo --version && git --version
      - uses: Swatinem/rust-cache@v2
        with:
          # tray-rs is its own workspace (own Cargo.lock) but its build lands in
          # the root target/ — key the cache on both locks or the tray deps
          # rebuild cold every PR (mirrors release.yml).
          workspaces: |
            .
            deploy/tray/tray-rs -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Required, not cosmetic: build.rs only writes a placeholder index.html, and api_v1's
      # v1_surface_and_browser_lane asserts /repos.js and /repos.mjs are served 200. Also runs
      # oxlint --deny-warnings and tsc --noEmit, so the web gate is covered here too.
      - name: Build the SPA and the SDK
        run: just web-build
      # The renderer security boundary (issue #112) — vitest, jsdom.
      - name: Web unit tests
        run: just web-test

      - run: just warnings
      - name: Release changelog filter
        run: scripts/check-release-changelog-filter.sh
      # #137's structural anti-drift guard, generalized to every crate by #141:
      # the filesystem (crates/*/tests/*.rs) is the truth, the justfile's lane
      # variables (SERVER_TESTS / CLI_TESTS / WILDCARD_TEST_PKGS) are the claim;
      # scripts/suite-guard.sh is the one script (runnable identically on a
      # laptop) that goes red on an unregistered suite, on a vacuous glob/empty
      # lane (#140's fix), or on a recipe line that stops interpolating its
      # variable — whole-line anchored, so no prefix edit can bypass it. Both
      # legs consume the same variables, so this one check covers both; the two
      # explicit lanes additionally assert no listed suite compiled to zero
      # tests (ubuntu's Fast tier and CLI steps below, windows' Server
      # integration) — the wildcard lane's whole-directory glob has no such
      # assertion, so a cfg-gated suite there would still compile to an empty
      # binary and exit green.
      - name: Integration suite lists are complete
        run: bash scripts/suite-guard.sh
      # The 300 s timeout in the justfile can trip under CI load (measured
      # exit 124 on 2026-08-28); a rerun after a timeout is a retry, not a
      # regression signal. The retry lives inside this step, like sim/e2e: a
      # separate `if: failure()` step would re-run after ANY earlier step
      # failure (web-build, warnings) and, when the retry succeeded, would
      # still leave the job red and get reported as a regression.
      #
      # The zero-test assertion re-runs the integration set once so it can be tee'd
      # on its own (~20 s for its 80 tests): a suite gated behind #[cfg(windows)]
      # compiles to an empty binary on ubuntu and cargo still exits 0, and the
      # windows leg's identical assertion cannot see that direction — the pair is
      # what makes "registered" mean "executed". It cannot fold into `just test`:
      # the workspace bin/lib targets legitimately print `running 0 tests` there.
      - name: Fast tier (retry once on timeout)
        run: |
          set -eo pipefail
          just test || { echo "test failed once (possibly a CI-load timeout); rerunning"; sleep 5; just test; }
          just test-server-integration 2>&1 | tee server-integration.log || { echo "integration set failed once; rerunning"; sleep 5; just test-server-integration 2>&1 | tee server-integration.log; }
          if grep -n '^running 0 tests' server-integration.log; then
            echo "a listed suite ran 0 tests on ubuntu — a platform gate hid it (#137); the lines above name the binary"
            exit 1
          fi
      # The walgit-cli integration suites (D1 CI runner + collab CLI) — the
      # first execution lane these ever had (#141: compiled on both legs, run
      # nowhere). Ubuntu-only; the per-file platform seams that bar a windows
      # lane are argued at the justfile's CLI_TESTS. Measured: 8 tests, 13–34 s
      # of run (two laptop measurements) + link of the two test binaries —
      # timeout-minutes guards the lane. No built-in rerun: this set
      # has no flake history yet, and a step that adds one MUST name itself in
      # the summary job's rerun_once regex in the same commit. The zero-test
      # assertion (#137's "registered means executed") keeps a future cfg-gate
      # from shrinking it silently.
      - name: CLI integration suites
        timeout-minutes: 10
        run: |
          set -eo pipefail
          just test-cli 2>&1 | tee cli-integration.log
          if grep -n '^running 0 tests' cli-integration.log; then
            echo "a registered CLI suite ran 0 tests on ubuntu — a platform gate hid it (#137 shape, #141); the lines above name the binary"
            exit 1
          fi
      # Rerun once on failure: sim has known-flaky cases (base_rebuild, AGENTS.md §5);
      # a second failure is a regression. The rate cannot be read off this step: the
      # rerun is why #138 had to count first-pass reds in the logs instead.
      - name: Simulation suite
        run: |
          just sim || { echo "sim failed once (possibly known-flaky); rerunning"; sleep 5; just sim; }
      # The .deb assembly is only exercised by release.yml on a tag push — validate
      # the script (control fields, layout, naming) on every PR with debug binaries,
      # the way a tag build would with release ones (issue #108). Build the bins
      # explicitly: the earlier steps' test builds may not leave plain executables.
      # D49: the MCP adapter is a stdio protocol. The unit tests cover the message
      # layer in-process; this covers the *binary* speaking it — framing, no reply
      # to notifications, and the read-only surface (a writing tool must not be
      # listed until `--allow-write`).
      - name: MCP stdio smoke
        run: |
          # The earlier steps build test binaries; make sure the plain executable
          # exists before piping a session into it.
          cargo build -q -p walgit-cli --bin walgit
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            "{not json" \
            '{"jsonrpc":"2.0","id":3,"method":"nope"}' \
            | RUST_LOG=walgit=trace timeout 30 target/debug/walgit mcp --config walgit.example.toml > mcp-smoke.jsonl 2> mcp-smoke.err
          # The tracing smoke is only real if a trace level known to be emitted
          # reaches stderr. Without this, an empty stderr (or logs accidentally
          # on stdout) could still read green.
          test -s mcp-smoke.err || { echo "MCP smoke stderr is empty — tracing smoke is vacuous"; exit 1; }
          grep -Fq 'mcp stdio ready' mcp-smoke.err
          python3 - <<'PY'
          import json
          lines = [json.loads(l) for l in open("mcp-smoke.jsonl")]
          assert len(lines) == 4, lines  # the notification must not produce a reply
          assert all(l.get("jsonrpc") == "2.0" for l in lines), lines
          init, tools, bad, unknown = lines
          # stdout is a JSON-RPC stream: with `RUST_LOG=walgit=trace` set, a
          # single tracing line landing there would make this parse fail. (Logs
          # go to stderr; `walgit mcp` installs a stderr subscriber for exactly
          # this reason.)
          #
          # Ids come back in order, and the reply to the *last* request proves the
          # session kept going rather than stopping at the first one.
          assert [l["id"] for l in lines] == [1, 2, None, 3], lines
          assert init["result"]["protocolVersion"] == "2024-11-05", init
          names = [t["name"] for t in tools["result"]["tools"]]
          assert "repo_tree" in names, names
          assert "collab_entry" not in names, names
          assert bad["error"]["code"] == -32700, bad
          assert unknown["error"]["code"] == -32601, unknown
          print(f"MCP smoke OK - {len(names)} read-only tools")
          PY
      - name: Assemble and inspect the linux .deb
        run: |
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
          cargo build --workspace --bin walgit --bin walgit-server
          cargo build --target-dir target --manifest-path deploy/tray/tray-rs/Cargo.toml
          deploy/linux/build-deb.sh target/debug 0.0.0-ci
          dpkg-deb --info walgit_0.0.0-ci_amd64.deb
          dpkg-deb --contents walgit_0.0.0-ci_amd64.deb | grep -E 'usr/bin/|usr/share/walgit/walgit.example.toml|usr/share/walgit/walgit.toml.template|usr/share/applications/walgit-tray.desktop'
          dpkg-deb --ctrl-tarfile walgit_0.0.0-ci_amd64.deb | tar -t | grep postinst
          postinst="$(mktemp)"
          dpkg-deb --ctrl-tarfile walgit_0.0.0-ci_amd64.deb | tar -xO ./postinst >"$postinst"
          grep -Fq "base=\"\$home/.walgit\"" "$postinst"
          if grep -q 'cp /usr/bin/walgit' "$postinst"; then
            echo "postinst still copies the program into the user home" >&2
            exit 1
          fi

  # #178: the S3/R2 store contract was only exercised on a developer's
  # machine. rustfs is the reference local endpoint; the test creates a unique
  # prefix and cleans it up, so this job owns only the bucket itself.
  s3-contract:
    name: s3 store contract
    runs-on: ubuntu-latest
    services:
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: walgit-dev
          RUSTFS_SECRET_KEY: walgit-dev-secret
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_VOLUMES: /data
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -sf http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup show && cargo --version && git --version
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Create the rustfs bucket
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          # rustfs can report /minio/health/live before its storage quorum is
          # ready; a fresh bucket PUT then returns 503. Retry that, accept 409
          # as an already-created bucket, and fail loudly on anything else.
          for attempt in $(seq 1 30); do
            code="$(curl -sS -o /tmp/walgit-mk-bucket.out -w '%{http_code}' \
              --aws-sigv4 'aws:amz:us-east-1:s3' \
              --user 'walgit-dev:walgit-dev-secret' \
              -X PUT http://127.0.0.1:9000/walgit-test || true)"
            case "$code" in
              200|409) break ;;
              503) sleep 1 ;;
              *) cat /tmp/walgit-mk-bucket.out; exit 1 ;;
            esac
            if [ "$attempt" = 30 ]; then
              echo "rustfs bucket never became ready (last HTTP $code)"
              cat /tmp/walgit-mk-bucket.out
              exit 1
            fi
          done
      - name: S3 store contract
        run: just test-s3

  # Known-red until the debt lands (issue #1, ~1300 pre-existing pedantic
  # hits): the gate fails by design, so it is a separate job with
  # continue-on-error — never a merge blocker, always visible. A PR must keep
  # its increment at zero (template field); a red here with new warnings is a
  # regression regardless of the job's conclusion.
  clippy-known-red:
    name: clippy (known-red debt)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup show && cargo --version && git --version
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just clippy

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup show && cargo --version && git --version
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the SPA and the SDK
        run: just web-build
      # Rerun once on failure: reads_after_an_acknowledged_push is a known
      # flake (AGENTS.md §5 / issue #4); a second failure is a regression.
      - name: Smart-HTTP end-to-end
        run: |
          just e2e || { echo "e2e failed once (possibly known-flaky); rerunning"; sleep 5; just e2e; }

  # Reachability for every cfg(windows) branch (issue #16): this leg compiles
  # all targets and runs the test tiers on a real Windows host. Plain cargo for
  # the lib/bins, sim and e2e lines; `just` for everything whose lists live in
  # the justfile — issue #137 moved the server-integration set into
  # SERVER_TESTS and #141 the wildcard crates into WILDCARD_TEST_PKGS, one list
  # per lane both legs consume (the no-probe invariant is stated at
  # `test-server-integration`). #141 also put this leg's two former gaps to
  # bed: the web unit tests and a zero-rustc-warnings grep (the compile step,
  # same gate pattern as ubuntu's `just warnings`). What this leg does NOT run
  # is decided by seams, not speed: the walgit-cli suites are ubuntu-only,
  # argued per-file at the justfile's CLI_TESTS. This job exists exactly so
  # platform seams stop drifting unnoticed; the clippy leg waits on its
  # ruleset check (AGENTS.md §5).
  windows:
    name: windows fast tier
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: choco install protoc -y --no-progress
      - shell: pwsh
        run: rustup toolchain install stable --profile minimal; rustup default stable; rustup show; cargo --version; git --version
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the SPA and the SDK
        run: just web-build
        shell: bash
      # The renderer security boundary (issue #112) — vitest/jsdom, pure node,
      # same toolchain the windows-green web-build step above already installs
      # and runs; #141 closes the "vitest only ever ran on ubuntu" gap with it.
      - name: Web unit tests
        run: just web-test
        shell: bash
      - name: Compile every target (lib/bins/tests) and gate zero rustc warnings
        # bash, not the default pwsh: the recipe needs bash's `$'…'` ANSI-C
        # quoting and `set -o pipefail`. This is ALSO the windows zero-warning
        # gate (#141 — rustc-warning classes that only exist under
        # cfg(windows) used to reach main unguarded): this step's output is the
        # leg's only warning-bearing cargo invocation, so the grep must live
        # here — a later `cargo check` hits fresh cache and prints nothing,
        # which is #140's vacuous-green shape. `check` suffices: every gated
        # lint class fires before codegen. The pattern is the justfile's
        # `warning_gate` via `just --evaluate` — one copy for both legs, the
        # same single-source rule as the suite lanes.
        shell: bash
        run: |
          set -uo pipefail
          # Without -e (the ubuntu `warnings` recipe's shape): a command
          # substitution that fails must not fall through to a green grep.
          if ! out="$(cargo check --workspace --all-targets 2>&1)"; then
            printf '%s\n' "$out"
            echo; echo "cargo check failed — fix the errors above"; exit 1
          fi
          plain="$(printf '%s\n' "$out" | sed $'s/\x1b\\[[0-9;]*m//g')"
          gate="$(just --evaluate warning_gate)"
          if printf '%s\n' "$plain" | grep -qE "$gate"; then
            printf '%s\n' "$plain" | grep -E '^warning' -A4 | grep -vE '^warning: `walgit-[a-z]+`' || true
            echo; echo "rustc warnings present — fix them (same gate as ubuntu's just warnings, issue #141)"; exit 1
          fi
          printf '%s\n' "$plain" | grep -E '^(warning|error)' || echo "no rustc warnings"
      - name: Fast hermetic tier
        # bash, not the default pwsh: on Windows pwsh keeps going after a failing
        # native command and the step's exit code is the LAST line's — a broken
        # first tier would read green. bash stops at the first non-zero.
        shell: bash
        run: |
          set -e
          cargo test --workspace --lib --bins
          # The wildcard crates set — the justfile's WILDCARD_TEST_PKGS, one
          # list both legs consume (#141; this leg's hand-enumerated `-p` lines
          # are gone — the ubuntu `test` recipe now runs the same recipe).
          # Set-level rerun once (windows timing; AGENTS.md §5 — the walgit-wal
          # refs-sync case, issue #94; the same shape as Server integration
          # below), then a repeat is real.
          just test-wildcard-crates || { echo "wildcard crates failed once (windows timing flaky); rerunning"; sleep 3; just test-wildcard-crates; }
      # The server integration suites: the justfile's SERVER_TESTS — the same 14
      # both legs run (issue #137; this leg's hand-copied enumeration is gone).
      # Suite-set-level rerun once (windows timing; AGENTS.md §5), then a repeat
      # is real. timeout-minutes replaces the justfile's tN guards — windows must
      # not wrap cargo lines with them (see the recipe's comment). The zero-test
      # assertion: a cfg-gated suite compiles to an empty binary and exits GREEN,
      # which is #137's silent-shrinkage failure one granularity deeper; this leg
      # is where shrinkage was proven possible, so the assertion lives here too (the
      # ubuntu leg carries the mirror-image check for #[cfg(windows)]-only suites).
      - name: Server integration
        shell: bash
        timeout-minutes: 10
        run: |
          set -eo pipefail
          just test-server-integration 2>&1 | tee server-integration.log || { echo "server integration failed once (windows timing flaky); rerunning"; sleep 5; just test-server-integration 2>&1 | tee server-integration.log; }
          if grep -n '^running 0 tests' server-integration.log; then
            echo "a listed suite ran 0 tests on windows — a platform gate hid it (#137); the lines above name the binary"
            exit 1
          fi
      - name: Simulation suite
        # Fault-injected cluster (WALGIT_SIM_SEEDS, default 2). Known flaky:
        # base_rebuild_resumes_after_a_kill_between_any_two_phases (shared
        # TEST_ABORT_AFTER; AGENTS.md §5) — rerun once, not skip. Note this rerun
        # is exactly why the step cannot measure its own flake rate: #138 had to
        # count first-pass reds in the log, not job conclusions.
        shell: bash
        run: |
          cargo test -p walgit-server --test sim || { echo "sim failed once (possibly known-flaky); rerunning"; sleep 5; cargo test -p walgit-server --test sim; }
      - name: Smart-HTTP end-to-end
        # Real git against the server; the SPA build above is its only
        # precondition (api_v1 asserts the built assets are served).
        shell: bash
        run: |
          cargo test -p walgit-server --test e2e || { echo "e2e failed once (possibly known-flaky); rerunning"; sleep 5; cargo test -p walgit-server --test e2e; }
      - name: Installer uninstall-safety guard
        # Inno marks ExtractTemporaryFile sfNoUninstall, but TaskOwnership is
        # called from the uninstall path too. Keep the shared script installed
        # as a normal file and prevent the unavailable API from returning.
        shell: bash
        run: |
          # Case-insensitive and plural-tolerant: Inno identifiers are
          # case-insensitive, so `extracttemporaryfiles` is the same trap.
          if grep -inE 'extracttemporaryfiles?' deploy/windows/installer.iss; then
            echo 'installer.iss uses an API unavailable to uninstallers (sfNoUninstall)' >&2
            exit 1
          fi
          # Full-line match: a trailing `Flags: dontcopy` would silently turn the
          # shared script back into an install-only temp file.
          grep -nqE '^Source: "task-ownership\.ps1"; DestDir: "\{app\}"; Flags: ignoreversion$' deploy/windows/installer.iss || {
            echo 'task-ownership.ps1 must be installed as a normal {app} file' >&2
            exit 1
          }
      - name: Type-check the Windows installer
        # `installer.iss` only ever compiles on a release tag otherwise, so a
        # Pascal slip (or a missing Source file) would surface as a broken
        # release. ISCC validates the [Code] section against dummy payloads —
        # cheap, and it is the only pre-tag compile the script gets.
        shell: bash
        run: |
          mkdir -p target/release
          : > target/release/walgit.exe
          : > target/release/walgit-tray.exe
          : > target/release/walgit-upgrade-helper.exe
          iscc="$(command -v ISCC.exe || echo '/c/Program Files (x86)/Inno Setup 6/ISCC.exe')"
          "$iscc" "-DMyAppVersion=0.0.0-ci" deploy/windows/installer.iss
      - name: Task ownership runtime smoke
        # The installer consumes this same script. Exercise real Task Scheduler
        # objects here so a parser/encoding change cannot pass only ISCC.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = (Resolve-Path './deploy/windows/task-ownership.ps1').Path
          $task = 'walgit'
          $out = Join-Path $env:TEMP "walgit-task-ownership-$PID.txt"
          $app = $null

          function Get-Ownership {
            param([string]$Name)
            Remove-Item -LiteralPath $out -Force -ErrorAction SilentlyContinue
            & $probe -TaskName $Name -OutFile $out
            if (-not (Test-Path -LiteralPath $out -PathType Leaf)) {
              throw "task-ownership.ps1 did not write $out"
            }
            return (Get-Content -LiteralPath $out -Raw).Trim()
          }

          function Assert-Ownership {
            param([string]$Expected, [string]$Actual)
            if ($Actual -ne $Expected) { throw "expected '$Expected', got '$Actual'" }
          }

          try {
            Get-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue |
              Unregister-ScheduledTask -Confirm:$false
            Assert-Ownership 'absent' (Get-Ownership $task)

            $foreign = 'cmd.exe /c echo C:\nonexistent\walgit.exe'
            schtasks.exe /Create /TN $task /TR $foreign /SC ONCE /ST 23:59 /F | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "schtasks /Create foreign exited $LASTEXITCODE" }
            Assert-Ownership 'foreign' (Get-Ownership $task)

            $app = Join-Path $env:TEMP "walgit task ownership $PID"
            New-Item -ItemType Directory -Force -Path $app | Out-Null
            $exe = Join-Path $app 'walgit.exe'
            New-Item -ItemType File -Force -Path $exe | Out-Null
            $ourShape = 'cmd.exe /c ""{0}" serve"' -f $exe
            schtasks.exe /Create /TN $task /TR $ourShape /SC ONCE /ST 23:59 /F | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "schtasks /Create ours exited $LASTEXITCODE" }
            Assert-Ownership 'ours' (Get-Ownership $task)

            $bytes = [System.IO.File]::ReadAllBytes($out)
            if ($bytes -contains [byte]0) { throw 'ownership output contains NUL bytes' }
          }
          finally {
            Get-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue |
              Unregister-ScheduledTask -Confirm:$false
            Remove-Item -LiteralPath $out -Force -ErrorAction SilentlyContinue
            if ($app) { Remove-Item -LiteralPath $app -Recurse -Force -ErrorAction SilentlyContinue }
          }
      - name: Tray (Windows branch) compiles
        # tray-rs is its own workspace, so the root `cargo check --all-targets`
        # never sees it: without this the Windows tray path is only built at
        # release time (RULE_可达性). tray.yml covers PRs as well, but the
        # platform leg stays self-contained.
        shell: bash
        run: cargo check --target-dir target --manifest-path deploy/tray/tray-rs/Cargo.toml
      - name: Tray Windows release detection fixture
        # Assert the actual menu line, not merely that cfg(windows) compiles:
        # a real Windows tray binary runs from the installer directory against a
        # local release fixture and must offer the x64 setup asset.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --target-dir target --manifest-path deploy/tray/tray-rs/Cargo.toml
          $root = Join-Path $env:RUNNER_TEMP "walgit-tray-detection"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $oldLocal = $env:LOCALAPPDATA
          $oldProfile = $env:USERPROFILE
          try {
            $env:LOCALAPPDATA = Join-Path $root "LocalAppData"
            $env:USERPROFILE = Join-Path $root "User"
            $install = Join-Path $root "CustomInstall\walgit"
            New-Item -ItemType Directory -Force -Path $install | Out-Null
            New-Item -ItemType Directory -Force -Path (Join-Path $env:USERPROFILE ".walgit") | Out-Null
            Copy-Item target\debug\walgit-tray.exe (Join-Path $install "walgit-tray.exe") -Force
            Set-Content -LiteralPath (Join-Path $install ".walgit-install") -Value "0.5.0" -NoNewline

            $digest = -join (1..64 | ForEach-Object { 'a' })
            $fixture = Join-Path $root "latest.json"
            $body = '{"tag_name":"v0.9.9","assets":[{"name":"walgit-setup-0.9.9-x64.exe","browser_download_url":"https://example.invalid/setup.exe","digest":"sha256:' + $digest + '"}]}'
            Set-Content -LiteralPath $fixture -Value $body -NoNewline
            $lineFile = Join-Path $root "detected-line.txt"

            $env:WALGIT_APP_VERSION = "0.5.0"
            $env:WALGIT_RELEASE_FIXTURE = $fixture
            $env:WALGIT_REPO = Join-Path $root "no-source-repo"
            $env:WALGIT_DETECT_ONCE = "1"
            $env:WALGIT_DETECT_ONCE_FILE = $lineFile
            & (Join-Path $install "walgit-tray.exe")
            if ($LASTEXITCODE -ne 0) { throw "tray fixture exited $LASTEXITCODE" }
            $line = Get-Content -LiteralPath $lineFile -Raw
            if ($line -notmatch "下载并升级到 v0\.9\.9") {
              throw "windows release detection did not offer upgrade: $line"
            }
            $log = Get-Content -LiteralPath (Join-Path $env:USERPROFILE ".walgit\tray.log") -Raw
            if ($log -notmatch "app=0\.5\.0 release=v0\.9\.9") {
              throw "windows release detection was not logged: $log"
            }
          }
          finally {
            $env:LOCALAPPDATA = $oldLocal
            $env:USERPROFILE = $oldProfile
            Remove-Item Env:WALGIT_APP_VERSION -ErrorAction SilentlyContinue
            Remove-Item Env:WALGIT_RELEASE_FIXTURE -ErrorAction SilentlyContinue
            Remove-Item Env:WALGIT_REPO -ErrorAction SilentlyContinue
            Remove-Item Env:WALGIT_DETECT_ONCE -ErrorAction SilentlyContinue
            Remove-Item Env:WALGIT_DETECT_ONCE_FILE -ErrorAction SilentlyContinue
          }

      - name: Service lifecycle smoke (scheduled task, D48)
        # The real binary, the real task and the real port: `start` twice (must
        # not fork), then `stop` (the port must go quiet). This is the level the
        # old "stale pidfile orphans a live server" bug was visible at.
        shell: pwsh
        run: |
          # Parse first: a PowerShell quoting slip (a backtick before a closing
          # quote escapes it) otherwise surfaces only after the ~6 minute build.
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw ./deploy/windows/service-smoke.ps1)) | Out-Null"
          cargo build -p walgit-cli
          ./deploy/windows/service-smoke.ps1

  # PR summary: one authoritative comment per PR instead of raw job colors.
  # expected-red (clippy known debt) is annotated, everything else red is a
  # regression. Idempotent: updates the bot's existing comment, never adds a
  # new one. Runs only for pull_request events (push to main has no PR).
  summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [build-test, clippy-known-red, e2e, windows]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      actions: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100,
            });
            const lines = [];
            // Steps with a built-in rerun (sim/e2e/fast tier/server integration): a
            // failure there already survived one retry, so it is a regression, not a
            // flake. This matches step-name LITERALS: a step that reruns itself must
            // add its name here in the SAME commit (windows' "Fast hermetic tier"
            // predates this regex and has never matched it — #141 folded its
            // wal-only retry into a set-level retry and paid the naming debt; do
            // not create another such pair). Job names are ruleset-pinned
            // (AGENTS.md §6.4): never rename those.
            const rerun_once = /Simulation suite|Smart-HTTP end-to-end|Fast tier|Fast hermetic tier|Server integration/;
            for (const j of jobs) {
              if (j.name === 'CI summary') continue; // don't report on ourselves
              const failed = j.steps.filter(s => s.conclusion === 'failure').map(s => s.name);
              if (j.conclusion === 'success' || j.conclusion === 'skipped') {
                lines.push(`- ✅ **${j.name}** (${j.conclusion})`);
              } else if (j.name === 'clippy (known-red debt)') {
                lines.push(`- ⚠️ **${j.name}** — expected-red (known debt, issue #1); not a merge blocker`);
              } else if (j.conclusion === 'cancelled' || j.conclusion === 'neutral' || j.conclusion === 'timed_out') {
                lines.push(`- ⏭️ **${j.name}** — ${j.conclusion}, not a failure`);
              } else if (failed.length > 0 && failed.every(f => rerun_once.test(f))) {
                lines.push(`- ❌ **${j.name}** — real red (already rerun once): ${failed.join(', ')}`);
              } else {
                lines.push(`- ❌ **${j.name}** — real red: ${failed.join(', ') || j.conclusion}`);
              }
            }
            const red = jobs.filter(j => j.conclusion === 'failure' && j.name !== 'clippy (known-red debt)').length;
            const verdict = red === 0
              ? '**可合并**(无真实红;known-red clippy 除外)'
              : `**需处理**:${red} 个 job 真实失败`;
            const body = `## CI 摘要(agent 可读)\n${lines.join('\n')}\n\n${verdict}\n\n<!-- ci-summary -->`;
            const pr = context.payload.pull_request;
            // Read-only tokens make commenting 403 and turn this job red — skip
            // the comment for the two shapes that have one. (a) Dependabot
            // builds its branches inside the base repo (it passes any fork
            // check) but its workflow GITHUB_TOKEN is read-only; the PR author
            // is the stable marker. (b) Forks: compare repo IDs — `context.repo`
            // has no `full_name` (only {owner, repo}), so a full_name compare is
            // `undefined`-based and skips EVERY PR (#74); IDs also survive
            // renames. A deleted fork's `pr.head.repo` is null (`?.id` →
            // undefined ≠ base id) — a deleted fork still counts as a fork.
            const author = pr.user?.login ?? '';
            if (author === 'dependabot[bot]') {
              console.log(`PR by ${author}; read-only token — skipping the summary comment`);
              return;
            }
            if (pr.head.repo?.id !== pr.base.repo?.id) {
              console.log('PR from a fork; read-only token — skipping the summary comment');
              return;
            }
            const existing = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, per_page: 100,
            });
            const mine = existing.data.find(c => c.body.includes('<!-- ci-summary -->'));
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: mine.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, body,
              });
            }
